name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/youthful-hopper-hw3cj3]
  # Allows running this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from https://jerinjacob007.github.io/jerinjacobin/.
      # Remove both when moving to a custom domain (public/CNAME).
      SITE_URL: https://jerinjacob007.github.io
      BASE_PATH: /jerinjacobin
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
